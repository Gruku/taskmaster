<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Pre-paint theme apply. Duplicates resolveTheme() in js/lib/theme.js (key 'tm.theme') — keep the two in agreement. -->
  <script>
    (function () {
      var p = 'system';
      try { p = localStorage.getItem('tm.theme') || 'system'; } catch (e) {}
      var dark = true;
      try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) {}
      document.documentElement.dataset.theme = p === 'dark' || p === 'light' ? p : (dark ? 'dark' : 'light');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
