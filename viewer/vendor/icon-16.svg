<!-- User intent: the Board app icon redrawn on whole pixels for the 16 px favicon size only, where the 24-unit artwork blurs. Same design, simplified.
     Colours are Reality Reprojection ground-0, ground-20, ground-100 (dark) and signature, written as literals because an icon file cannot read CSS variables. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <rect x="0.5" y="0.5" width="15" height="15" rx="2.5" fill="#0d0d0c" stroke="#343331" stroke-width="1"/>
  <rect x="4" y="4" width="2" height="8" fill="#f5f3ed"/>
  <rect x="7" y="4" width="2" height="5" fill="#f5f3ed"/>
  <rect x="10" y="4" width="2" height="7" fill="#5e79e6"/>
</svg>
