[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmaster"
version = "7.1.0"
description = "Task/backlog management MCP server with narrative continuity (handovers, issues, decisions)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "gruku" }]
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4,<4", "httpx", "pydantic>=2", "pyyaml"]

[project.optional-dependencies]
# Test requirements (B-091): `uv pip install -e ".[dev]"` yields a venv that runs the suite.
dev = ["pytest", "pytest-xdist", "pytest-timeout"]

[tool.setuptools.packages.find]
include = ["taskmaster*"]
