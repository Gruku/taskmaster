# User intent: what a correct answer to each scenario looks like and which tool paths get there,
# for the orchestrator to grade against. Kept apart from the prompt text and never shown to the
# test agent; seed.py renders it to <home>/ground_truth.json with real ids and store read-backs.
#
# {h:key} {t:key} {b:key} {iso:-N} {nice:-N} are filled from the seed; a value that is exactly
# {c:name} is replaced by data read back from the seeded store (see seed.py::compute).
ground_truth:
  - id: s01-topic-yesterday
    answer: >-
      Two handovers, both in thread contract-as-tool, both dated {iso:-1}: {h:a5} (morning
      checkpoint, superseded) and {h:a6} (evening, open — the live resume point). A complete answer
      names both and says the evening one replaced the morning one. {h:d4} is also from yesterday
      but is about provider failover and must not be included.
    expected_ids: ["{h:a5}", "{h:a6}"]
    acceptable_paths:
      - "backlog_thread_list -> backlog_handover_list(thread='contract-as-tool', since={iso:-1}, until={iso:-1})"
      - "backlog_handover_list(since={iso:-1}, until={iso:-1}) then pick the contract ones by tldr"
      - "backlog_search('contract', kinds=['handover']) then filter by the date in the id"
      - "backlog_query over entities/entity_fts with a date filter"
    failure_modes:
      - "guesses thread='asset-contract' (or similar), gets 'No handovers match', reports none"
      - "returns only the open evening handover"
      - "includes older contract handovers ({h:a3}, {h:a2}) or the unrelated {h:d4}"
    reference:
      day: "{c:day_minus_1}"
      thread: "{c:contract_thread}"
      search_asset_contract: "{c:search_asset_contract_handovers}"
      search_contract: "{c:search_contract_handovers}"

  - id: s02-where-left-off
    answer: >-
      Thread gdd-brief-tool, newest handover {h:b5} ({iso:-2}): simple tables now reach the brief,
      tables with merged cells are still dropped. Next action: handle merged cells in
      brief/tables.py (row_to_bullet must expand spans); repro is tests/fixtures/gdd_merged.md;
      bug {b:merged_cells} is open on it.
    expected_ids: ["{h:b5}"]
    acceptable_paths:
      - "backlog_thread_list -> backlog_thread_resume('gdd-brief-tool')"
      - "backlog_search('GDD brief') -> backlog_handover_get({h:b5}, verbose=True)"
      - "backlog_handover_list(thread='gdd-brief-tool') after finding the thread name"
    failure_modes:
      - "answers from an older, superseded GDD handover"
      - "guesses a thread name such as 'gdd-brief' and reports nothing found"
    reference: "{c:gdd_thread}"

  - id: s03-open-per-workstream
    answer: >-
      One line per open line of work, taken from the newest open handover of each thread — see
      reference.open_latest_per_thread for the exact set. It includes atlas-budget, whose only
      handover ({h:f1}) is outside the 30-entry index, and two thread-less/loose ones ({h:h1},
      {h:h2}). ci-flake-hunt must not be listed (closed).
    acceptable_paths:
      - "backlog_handover_list(status='open', latest_per_thread=True, include_archived=True)"
      - "backlog_thread_list (reference.thread_board) — complete since fef7fd2 (open archived threads stay
        on the board); before that fix it omitted atlas-budget without saying so"
      - "backlog_query on entities WHERE kind='handover' AND status='open'"
    failure_modes:
      - "omits atlas-budget because the archived handovers were not searched and the footer was ignored"
      - "lists per-task or per-epic status instead of the open lines of work"
      - "lists superseded or closed handovers as open work"
      - "reports tasks instead of workstreams without saying so"
    reference:
      open_latest_per_thread: "{c:open_latest_per_thread}"
      thread_board: "{c:thread_board}"

  - id: s04-single-day
    answer: "Four handovers dated {iso:-3}: {h:c4} (superseded), {h:i1}, {h:d3}, {h:c5} (superseded)."
    expected_ids: ["{h:c4}", "{h:i1}", "{h:d3}", "{h:c5}"]
    acceptable_paths:
      - "backlog_handover_list(since={iso:-3}, until={iso:-3})"
      - "backlog_query on entities WHERE kind='handover' AND id LIKE '{iso:-3}%'"
    failure_modes:
      - "uses since= alone and returns everything from that day onward"
      - "passes a date in another format and stops at the error"
    reference: "{c:day_minus_3}"

  - id: s05-by-task
    answer: >-
      Every handover whose task_ids contains {t:thumbs} — see reference; one of them ({h:c1}) and
      one auto-stage checkpoint are outside the 30-entry index, so a default list is incomplete.
    acceptable_paths:
      - "backlog_handover_list(task_id='{t:thumbs}', include_archived=True)"
      - "backlog_query on handover_tasks WHERE task_id='{t:thumbs}'"
    failure_modes:
      - "lists only the indexed ones and presents that as complete despite the archive footer"
    reference: "{c:thumbs_task_handovers}"

  - id: s06-what-replaced
    answer: >-
      {h:c4} was superseded by {h:c5} (same day, evening). {h:c5} was itself superseded by {h:c6},
      which is the thread's current open handover. Naming {h:c5} is the required part; mentioning
      {h:c6} as the live one is the complete answer.
    expected_ids: ["{h:c5}"]
    acceptable_paths:
      - "backlog_handover_get('{h:c4}') and read superseded_by / the links block"
      - "backlog_handover_list(format='json') or verbose=True and read superseded_by"
      - "backlog_thread_resume('{h:c4}') lands on {h:c6} — acceptable only if the agent also finds the direct successor"
    failure_modes:
      - "answers {h:c6} only (thread_resume on a stale id jumps to the newest)"

  - id: s07-archived-fact
    answer: >-
      96 MB of atlas memory per scene (pages limited to 2048x2048 on mobile, 4096x4096 on desktop;
      enforced at import). The fact exists only in the body of {h:f1}, which is outside the
      30-entry handover index; the task {t:atlas} does not state it.
    expected_ids: ["{h:f1}"]
    acceptable_paths:
      - "backlog_search('atlas budget') -> backlog_handover_get('{h:f1}', verbose=True)"
      - "backlog_handover_list(include_archived=True) -> backlog_handover_get(verbose=True)"
      - "backlog_query over entity_fts"
    failure_modes:
      - "reads only the task and says no budget has been decided"
      - "finds the handover but reads the slim view (no body) and cannot state the number"
      - "before fef7fd2 the thread route failed (atlas-budget was missing from backlog_thread_list and
        backlog_thread_resume could not find it); since that fix backlog_thread_resume('atlas-budget') is an
        acceptable path"
    reference:
      search_atlas_budget: "{c:search_atlas_budget}"
      search_user_phrase: "{c:search_texture_atlas_memory_budget}"

  - id: s08-total-count
    answer: "{c:total_handovers}"
    answer_note: "30 are in the index, the rest are archived; an answer of 30 is wrong."
    acceptable_paths:
      - "backlog_handover_list(include_archived=True, format='json') -> total"
      - "backlog_handover_list() and add the 'N older handovers ... were not searched' footer to the count"
      - "backlog_query SELECT count(*) FROM entities WHERE kind='handover' AND deleted=0"
    failure_modes:
      - "counts the default listing and answers 30"
    reference:
      indexed: "{c:indexed_handovers}"
      archived: "{c:archived_handovers}"

  - id: s09-open-as-json
    answer: >-
      A JSON array/object covering exactly the open handovers in reference (ids, thread,
      next_action). It must include {h:f1}, which is open but outside the index.
    acceptable_paths:
      - "backlog_handover_list(status='open', format='json', include_archived=True)"
      - "backlog_query selecting id, thread, next_action from entities WHERE kind='handover' AND status='open'"
    failure_modes:
      - "parses the text listing by hand instead of asking for JSON"
      - "omits the archived open handover although the envelope says truncated/archived_omitted"
      - "returns latest-per-thread only when all open handovers were asked for"
    reference: "{c:open_handovers}"

  - id: s10-cross-entity-topic
    answer: >-
      At minimum: task {t:thumbs} (Thumbnail cache v2), bug {b:stale_preview} (stale preview after
      re-import, open, P1), the idea about pre-warming thumbnails at import, and the
      thumb-cache-v2 handover thread (current open handover {h:c6}; older ones superseded, {h:c1}
      archived). reference.search_thumbnail is what one full-text search returns.
    acceptable_paths:
      - "backlog_search('thumbnail') with no kinds filter"
      - "backlog_query over entity_fts"
      - "backlog_search plus backlog_handover_list(task_id='{t:thumbs}', include_archived=True) for the full thread"
    failure_modes:
      - "searches one kind only (tasks, or handovers) and stops"
      - "uses a multi-word query that is ANDed down to nothing and reports no results"
    reference:
      search_thumbnail: "{c:search_thumbnail}"
      search_thumbnails: "{c:search_thumbnails}"
      search_thumbnail_caching: "{c:search_thumbnail_caching}"
      thumbs_task_handovers: "{c:thumbs_task_handovers}"

  - id: s11-changed-since-handover
    answer: >-
      Everything recorded after {h:c6} was created — see reference.entities (keyed kind/id, in
      order). In words: the CI uv-cache task was completed (and its handover closed); GDD brief,
      contract-tool and provider-failover handovers were written, each superseding its
      predecessor; a new task for contract error messages and a new bug on negative prompts were
      created; the empty-schema bug was fixed; the failover task's next step changed. Also (second
      batch seed): two more secondary-provider bugs and a shelved brief-footer bug were created
      yesterday, and a legacy re-tagging task was picked today.
      The rows right after anchor_seq that were written by the handover's own create (its
      predecessor's supersession, an index-overflow `archive` of an old handover) may be included
      or left out. `archive` ops on old handovers are index-overflow bookkeeping, not user changes;
      every timestamp in the change log is backdated consistently with the handover dates.
    acceptable_paths:
      - "backlog_query on changes to find the seq of the handover's create row, then backlog_changes_since(since_seq=<seq>)"
      - "backlog_query on changes WHERE seq > (that seq)"
      - "backlog_query on changes WHERE ts > the handover's created timestamp"
    failure_modes:
      - "calls backlog_changes_since() with no arguments, gets an empty feed plus a cursor, reports 'nothing changed'"
      - "passes the handover id as the cursor"
      - "answers from handover dates alone and misses task/bug changes"
    reference: "{c:changes_after_anchor}"

  - id: s12-mark-replaced
    answer: >-
      One mutating call: backlog_handover_supersede(old_id='{h:h2}', new_id='{h:d5}'). Afterwards
      {h:h2} has status superseded and superseded_by {h:d5}. Check the run's log for exactly this
      pair, in this direction.
    expected_call:
      tool: backlog_handover_supersede
      args: {old_id: "{h:h2}", new_id: "{h:d5}"}
    acceptable_paths:
      - "backlog_handover_list / backlog_search to find both ids, then backlog_handover_supersede"
    failure_modes:
      - "swaps old and new"
      - "picks {h:d2} (the provider-fallback handover written the same day as the notes) as the old one"
      - "uses backlog_handover_update_status(status='superseded') — sets the status but records no successor"
      - "writes a new handover with supersedes= instead of linking the two existing ones"

  - id: s13-last-session
    answer: >-
      Ambiguous by design. The session changelog's last entry is from {iso:-2} (CI: uv environment
      cached, cold runs under two minutes) — that is what reference.last_session returns. The
      newest recorded work, however, is today's handover {h:d5} (provider failover negative-prompt
      fix, in review), with contract-tool work yesterday. A good answer reports the most recent
      work and says which source it used; answering only the {iso:-2} CI entry as "the last
      session" is stale.
    acceptable_paths:
      - "backlog_last_session, cross-checked against backlog_handover_list / backlog_thread_list"
      - "backlog_handover_list(limit=...) newest first"
    failure_modes:
      - "calls backlog_last_session only and presents a two-day-old entry as the last session"
    reference:
      last_session: "{c:last_session}"

  - id: s14-decision-in-body
    answer: >-
      In the tool response envelope, as `contract_version` — not in the generation agent's system
      prompt, because a prompt-pinned version went stale as soon as the registry changed. The
      validator accepts the current version or the one before it and rejects older as fatal. The
      decision is only in the body of {h:a6}; its tldr and next_action do not state it.
    expected_ids: ["{h:a6}"]
    acceptable_paths:
      - "backlog_thread_list -> backlog_thread_resume('contract-as-tool')"
      - "backlog_search('contract version' / 'schema version') -> backlog_handover_get('{h:a6}', verbose=True or sections=['decisions'])"
    failure_modes:
      - "reads only list output or the slim handover view and reports that no such decision is recorded"

  # ── second batch ──────────────────────────────────────────────────────────────────────────────
  - id: s15-next-up
    answer: >-
      Two tasks are ready in the active phase (alpha): {t:metrics} "Emit failover metrics to the job
      dashboard" (high) first, then {t:glossary} "Glossary section in the brief" (medium). {t:retry}
      and {t:batchgen} are todo too but blocked by dependencies ({t:contract} is still in progress).
      The 48 legacy re-tagging tasks are todo but in the planned beta phase.
    expected_ids: ["{t:metrics}", "{t:glossary}"]
    acceptable_paths:
      - "backlog_next_available"
      - "backlog_status (its Next Up list)"
      - "backlog_context(scope='project')"
    failure_modes:
      - "backlog_list_tasks(status='todo') and recommends a blocked task or a beta re-tagging task"
      - "reports the first 50 todo rows as the candidates without noticing the cap"
    reference:
      next_available: "{c:rb_next_available}"
      list_todo_default: "{c:rb_list_todo_default}"

  - id: s16-downstream-chain
    answer: >-
      {t:retry} (Retry budget for contract repair rounds) depends on {t:contract} directly, and
      {t:batchgen} (Contract-aware batch generation) depends on {t:retry}, so it is held up
      transitively. Both are needed for a complete answer.
    expected_ids: ["{t:retry}", "{t:batchgen}"]
    acceptable_paths:
      - "backlog_dependencies(task_id='{t:contract}', depth>=2)"
      - "backlog_dependencies on {t:contract}, then again on {t:retry}"
      - "backlog_query over the depends_on fields"
    failure_modes:
      - "default depth=1 only and reports {t:retry} as the whole impact"
      - "uses backlog_blast_radius (file/anchor overlap, not the dependency chain)"
    reference:
      depth1: "{c:rb_deps_contract_depth1}"
      depth3: "{c:rb_deps_contract_depth3}"

  - id: s17-ready-to-close
    answer: >-
      No. {t:thumbs} has outstanding review gates (spec-review, plan-review, review-gate on its
      full lane) and an open P1 bug filed against it, {b:stale_preview} (stale preview after
      re-import), which blocks completion; its open handover says the fix still has to be verified
      on Windows before THUMBS_V2 is flipped on.
    acceptable_paths:
      - "backlog_context(focus='{t:thumbs}', scope='task') — names gates, bug and handover in one call"
      - "backlog_task_pipeline('{t:thumbs}') + backlog_bug_list(found_in='{t:thumbs}')"
    failure_modes:
      - "reads backlog_get_task only (shows gate_state but not the open bug) and misses the bug"
      - "reads the pipeline only and misses the open bug"
      - "tries backlog_complete_task to find out (and on success would have closed it)"
    checks:
      - desc: "task not closed"
        sql: "SELECT status FROM entities WHERE kind='task' AND id='{t:thumbs}'"
        expect: "in-progress"
    reference:
      context: "{c:rb_context_thumbs}"
      pipeline: "{c:rb_pipeline_thumbs}"

  - id: s18-start-task
    answer: "{t:metrics} is picked: status in-progress and claimed (locked) by the agent's session."
    acceptable_paths:
      - "backlog_pick_task('{t:metrics}')"
    failure_modes:
      - "backlog_update_task(field='status', value='in-progress') — status moves but no claim is taken"
      - "picks a different task"
    checks:
      - desc: "in progress and claimed"
        sql: "SELECT status, coalesce(json_extract(doc,'$.locked_by'),'') != '' FROM entities WHERE kind='task' AND id='{t:metrics}'"
        expect_rows: [["in-progress", 1]]
      - log_called: backlog_pick_task
        args: {task_id: "{t:metrics}"}
        desc: "used the pick tool"

  - id: s19-reprioritise
    answer: "{t:glossary} high, {t:retry} high, {t:linking} medium; nothing else changed."
    acceptable_paths:
      - "backlog_batch_update(operations='update {t:glossary} priority high\\n...')"
      - "three backlog_update_task(field='priority') calls"
    failure_modes:
      - "uses backlog_batch_preview and believes it applied"
      - "picks the wrong 'linking' task or bumps linking to high"
    checks:
      - desc: "glossary high"
        sql: "SELECT json_extract(doc,'$.priority') FROM entities WHERE kind='task' AND id='{t:glossary}'"
        expect: "high"
      - desc: "retry budget high"
        sql: "SELECT json_extract(doc,'$.priority') FROM entities WHERE kind='task' AND id='{t:retry}'"
        expect: "high"
      - desc: "section linking medium"
        sql: "SELECT json_extract(doc,'$.priority') FROM entities WHERE kind='task' AND id='{t:linking}'"
        expect: "medium"

  - id: s20-skip-gates-close
    answer: >-
      Each outstanding gate of {t:upload} (design-review and review-gate on its standard lane) is
      skipped with a reason that says why (config-only change, per the user), then the task is
      completed: status done.
    acceptable_paths:
      - "backlog_task_pipeline -> backlog_skip_gate x2 (reason, by='user') -> backlog_complete_task"
      - "backlog_complete_task first, read the refusal, then skip the named gates and complete"
    failure_modes:
      - "backlog_record_gate(verdict='pass') — records reviews that never happened instead of skipping"
      - "stops at the refusal and reports the task cannot be closed"
      - "backlog_update_task(status='done') — refused by the same gates"
    checks:
      - desc: "task done"
        sql: "SELECT status FROM entities WHERE kind='task' AND id='{t:upload}'"
        expect: "done"
      - desc: "design-review and review-gate recorded as skipped, not passed"
        sql: "SELECT json_extract(doc,'$.gates.\"design-review\".skipped'), json_extract(doc,'$.gates.\"review-gate\".skipped') FROM entities WHERE kind='task' AND id='{t:upload}'"
        expect_rows: [[1, 1]]
      - log_not_called: backlog_record_gate
        desc: "no review verdict fabricated"
    reference:
      pipeline_before: "{c:rb_pipeline_upload}"

  - id: s21-acceptance-criteria
    answer: >-
      One counter per provider (jobs started, jobs failed over, jobs failed); the dashboard shows
      the failover rate over the last 24 hours; an alert fires when the failover rate stays above 15%
      for 30 minutes. Per-image cost is out of scope.
    acceptable_paths:
      - "backlog_get_task('{t:metrics}', sections=['notes']) or verbose=True"
    failure_modes:
      - "reads the slim view only (its tldr holds just the first criterion) and reports one criterion"
      - "backlog_document(kind='task') — answers '(no body)' for a task whose text lives in notes"
    reference:
      notes: "{c:rb_metrics_notes}"
      slim: "{c:rb_metrics_slim}"

  - id: s22-count-unstarted
    answer: "{c:todo_tasks}"
    answer_note: >-
      Tasks in status todo (not archived). backlog_list_tasks(status='todo') shows only the first
      50 with a 'showing first 50' header; backlog_status prints 'Todo: N'.
    acceptable_paths:
      - "backlog_status (Todo count)"
      - "backlog_list_tasks(status='todo', limit=0)"
      - "backlog_query SELECT count(*) FROM entities WHERE kind='task' AND status='todo' AND archived=0"
    failure_modes:
      - "counts the default list and answers 50"
    reference:
      total_tasks: "{c:total_tasks}"
      list_todo_default: "{c:rb_list_todo_default}"

  - id: s23-collision-check
    answer: >-
      It is anchored to pipeline/providers/** and dashboards/jobs/**, and pipeline/providers/**
      overlaps {t:fallback} (provider failover), which is in progress.
    acceptable_paths:
      - "backlog_blast_radius('{t:metrics}')"
      - "backlog_get_task(verbose) for the anchors + backlog_query on entity_paths"
    failure_modes:
      - "answers from dependencies only ('it depends on nothing, so no overlap')"
    reference: "{c:rb_blast_metrics}"

  - id: s24-ready-for-beta
    answer: >-
      No. Alpha has 13 tasks and only 3 are done; the rest are in progress, in review or todo (see
      reference). Nothing should be changed: advancing the phase would mark alpha done, archive its
      done tasks and activate beta despite the unfinished work.
    acceptable_paths:
      - "backlog_phase_status"
      - "backlog_status"
    failure_modes:
      - "calls backlog_advance_phase to 'check' — it advances (with only a warning)"
    checks:
      - log_not_called: backlog_advance_phase
        desc: "phase not advanced"
      - desc: "alpha still active"
        sql: "SELECT status FROM entities WHERE kind='phase' AND id='alpha'"
        expect: "active"
    reference: "{c:rb_phase_status}"

  - id: s25-new-epic
    answer: >-
      A new epic (id of the agent's choosing, e.g. localisation) with done_when stating the brief
      renders in English, German and Japanese, and area brief-tool.
    acceptable_paths:
      - "backlog_area_list (to find the area id) -> backlog_add_epic(epic_id, name, done_when, area='brief-tool')"
    failure_modes:
      - "creates the epic without the area"
      - "creates a new area instead of using brief-tool"
      - "backlog_add_task instead of an epic"
    checks:
      - desc: "one new epic in area brief-tool"
        sql: "SELECT count(*) FROM entities WHERE kind='epic' AND deleted=0 AND json_extract(doc,'$.area')='brief-tool' AND id!='design-docs'"
        expect: 1
      - desc: "its done_when names the languages"
        sql: "SELECT count(*) FROM entities WHERE kind='epic' AND id!='design-docs' AND json_extract(doc,'$.area')='brief-tool' AND json_extract(doc,'$.done_when') LIKE '%German%' AND json_extract(doc,'$.done_when') LIKE '%Japanese%'"
        expect: 1
      - desc: "no new area"
        sql: "SELECT count(*) FROM entities WHERE kind='area' AND deleted=0"
        expect: 3

  - id: s26-epic-done
    answer: "Epic ci-health has status done; it and its two tasks are not archived."
    acceptable_paths:
      - "backlog_update_epic(epic_id='ci-health', field='status', value='done')"
    failure_modes:
      - "backlog_archive_epic — archives the epic and cascades the archive to all its tasks"
    checks:
      - desc: "epic status done"
        sql: "SELECT status FROM entities WHERE kind='epic' AND id='ci-health'"
        expect: "done"
      - desc: "nothing archived"
        sql: "SELECT count(*) FROM entities WHERE archived=1 AND ((kind='epic' AND id='ci-health') OR (kind='task' AND epic='ci-health'))"
        expect: 0
      - log_not_called: backlog_archive_epic

  - id: s27-open-bugs
    answer: >-
      Five open bugs: {b:style_dropped}, {b:seed_dropped} and {b:negative_prompt} (all found in
      {t:fallback}), {b:stale_preview} (found in {t:thumbs}), {b:merged_cells} (found in {t:brief}).
      {b:footer} is shelved and {b:empty_schema} fixed — neither is open.
    expected_ids: ["{b:style_dropped}", "{b:seed_dropped}", "{b:negative_prompt}", "{b:stale_preview}", "{b:merged_cells}"]
    acceptable_paths:
      - "backlog_bug_list(status='open')"
      - "backlog_bug_list() and filter by status"
    failure_modes:
      - "lists every active bug including the shelved and fixed ones as open"
      - "answers with issues (backlog_issue_list) instead of bugs"
    reference:
      open: "{c:rb_bugs_open}"
      default: "{c:rb_bugs_default}"

  - id: s28-log-bug
    answer: "One new bug, found_in {t:brief}, describing the US-style (month-first) date in the brief header."
    acceptable_paths:
      - "backlog_bug_create(title, found_in='{t:brief}', ...)"
    failure_modes:
      - "backlog_issue_create — a one-off defect, not recurring or systemic"
      - "backlog_add_task, backlog_idea_create or a note"
      - "bug created without found_in"
    checks:
      - desc: "one new bug found in the GDD brief task"
        sql: "SELECT count(*) FROM entities WHERE kind='bug' AND deleted=0 AND id NOT IN ('B-001','B-002','B-003','B-004','B-005','B-006','B-007') AND json_extract(doc,'$.found_in')='{t:brief}'"
        expect: 1
      - desc: "no new issue"
        sql: "SELECT count(*) FROM entities WHERE kind='issue' AND deleted=0"
        expect: 4

  - id: s29-roll-up-bugs
    answer: >-
      The pattern scan groups {b:negative_prompt}, {b:seed_dropped} and {b:style_dropped}
      (component providers, same title tokens). Promote all three into one new P1 issue with an
      evidence rationale; each bug ends with status promoted and promoted_to the new ISS id.
    acceptable_paths:
      - "backlog_bug_pattern_scan -> backlog_bug_promote(bug_ids=[...3], title, severity='P1', evidence_text)"
      - "backlog_bug_list + reading titles -> backlog_bug_promote"
    failure_modes:
      - "backlog_issue_create by hand — the bugs stay open and unlinked"
      - "promotes only some of the three, or includes an unrelated bug"
    checks:
      - desc: "the three provider bugs are promoted"
        sql: "SELECT count(*) FROM entities WHERE kind='bug' AND id IN ('{b:negative_prompt}','{b:seed_dropped}','{b:style_dropped}') AND status='promoted'"
        expect: 3
      - desc: "one new P1 issue"
        sql: "SELECT count(*) FROM entities WHERE kind='issue' AND deleted=0 AND json_extract(doc,'$.severity')='P1' AND id NOT IN ('{i:flakes}','{i:timeouts}')"
        expect: 1
      - desc: "no other bug promoted"
        sql: "SELECT count(*) FROM entities WHERE kind='bug' AND status='promoted'"
        expect: 3
    reference: "{c:rb_bug_patterns}"

  - id: s30-worst-unresolved-issue
    answer: >-
      {i:timeouts} "Primary image provider times out under batch load" — P1, status investigating.
      Repro: queue 400 generation jobs in one batch against the primary provider between 14:00 and
      17:00 UTC and watch pipeline/providers/primary.py request durations (about 1 in 25 exceeds the
      30 s budget); not reproducible below ~150 concurrent jobs. ({i:flakes} is P1 too but fixed.)
    expected_ids: ["{i:timeouts}"]
    acceptable_paths:
      - "backlog_issue_list() -> backlog_issue_get('{i:timeouts}', verbose=True or sections=['repro'])"
    failure_modes:
      - "backlog_issue_list(status='open') — silently drops the 'investigating' P1 and answers {i:no_headings} (P2)"
      - "answers {i:flakes} (P1 but fixed)"
      - "reads the slim issue view and cannot give the repro"
      - "answers with a bug instead of an issue"
    reference:
      default_list: "{c:rb_issues_default}"
      status_open_list: "{c:rb_issues_status_open}"
      issue: "{c:rb_issue_timeouts}"

  - id: s31-issue-fixed
    answer: "{i:no_headings} status fixed, fixed_in_task {t:brief}."
    acceptable_paths:
      - "backlog_issue_update(field='fixed_in_task', value='{t:brief}') then backlog_issue_update(field='status', value='fixed')"
    failure_modes:
      - "sets status first, hits the 'requires fixed_in_task' error and stops"
      - "updates a bug or the task instead of the issue"
    checks:
      - desc: "issue fixed in the GDD brief task"
        sql: "SELECT status, json_extract(doc,'$.fixed_in_task') FROM entities WHERE kind='issue' AND id='{i:no_headings}'"
        expect_rows: [["fixed", "{t:brief}"]]

  - id: s32-resolve-decision
    answer: "{d:linking} resolved with option 1 (an `implements:` list on each task), rationale: survives a design-doc rewrite."
    acceptable_paths:
      - "backlog_decision(action='list') -> backlog_decision(action='resolve', decision_id='{d:linking}', resolved_with=1, rationale=...)"
    failure_modes:
      - "backlog_decision_create — a second decision instead of resolving the open one"
      - "resolves with option 2 (off-by-one on a 1-indexed option)"
      - "resolves {d:notify} instead"
    checks:
      - desc: "resolved with option 1"
        sql: "SELECT status, json_extract(doc,'$.resolved_with') FROM entities WHERE kind='decision' AND id='{d:linking}'"
        expect_rows: [["resolved", 1]]
      - desc: "no new decision"
        sql: "SELECT count(*) FROM entities WHERE kind='decision' AND deleted=0"
        expect: 3

  - id: s33-settled-decision
    answer: >-
      `<type>_<name>_<variant>_v###.<ext>` (option 2 of {d:naming}, resolved): type first so the asset
      browser groups sprites, meshes and audio together; the version suffix keeps earlier
      generations side by side instead of overwriting them.
    expected_ids: ["{d:naming}"]
    acceptable_paths:
      - "backlog_search('naming') -> backlog_decision(action='get', decision_id='{d:naming}')"
      - "backlog_decision(action='list', status='resolved' or 'all') -> get"
    failure_modes:
      - "backlog_decision(action='list') with the default status=open shows nothing; reports no decision exists"
      - "reports the recommendation without checking it was the option chosen"
    reference:
      search: "{c:rb_search_naming}"
      decision: "{c:rb_decision_naming}"
      open_list: "{c:rb_decisions_open}"

  - id: s34-park-idea
    answer: "One new idea about perceptual-hash dedupe of generated sprites, tagged performance; no task created."
    acceptable_paths:
      - "backlog_idea_create(title, body, tags=['performance'])"
    failure_modes:
      - "backlog_add_task — the user said it is not a task"
      - "a desk note instead of an idea"
      - "idea without the performance tag"
    checks:
      - desc: "one new idea tagged performance"
        sql: "SELECT count(*) FROM entities e, json_each(json_extract(e.doc,'$.tags')) t WHERE e.kind='idea' AND e.id NOT IN ('IDEA-001','{idea:batch_fetch}','{idea:warm_up}','{idea:token_cache}') AND t.value='performance'"
        expect: 1
      - desc: "no task created"
        sql: "SELECT count(*) FROM entities WHERE kind='task' AND deleted=0"
        expect: "{c:total_tasks}"

  - id: s35-desk-note
    answer: "One new pinned desk note asking infra for the Windows test machine before Friday."
    acceptable_paths:
      - "backlog_note(action='create', text=..., pinned=True)"
    failure_modes:
      - "note not pinned"
      - "idea, task or handover instead of a note"
    checks:
      - desc: "one new pinned note"
        sql: "SELECT count(*) FROM entities WHERE kind='note' AND deleted=0 AND id NOT IN ('{n:publisher}','{n:windows}') AND json_extract(doc,'$.pinned')=1"
        expect: 1

  - id: s36-area-work
    answer: >-
      The design-docs epic (Design Docs Tooling) is filed under brief-tool, so all its tasks:
      see reference.design_docs_tasks. Only {t:glossary} carries the area itself, which is all
      backlog_list_tasks(area='brief-tool') returns.
    acceptable_paths:
      - "backlog_area_list -> backlog_query for epics/tasks whose area is brief-tool -> backlog_list_tasks(epic='design-docs')"
      - "backlog_list_tasks(area='brief-tool') plus a check of which epics carry the area"
    failure_modes:
      - "backlog_list_tasks(area='brief-tool') only and reports a single task as everything"
    reference:
      design_docs_tasks: "{c:design_docs_tasks}"
      list_tasks_area: "{c:rb_list_tasks_area_brief}"
      area: "{c:rb_area_brief}"

  - id: s37-area-add-path
    answer: "Area brief-tool anchors become [brief/**, docs/gdd/**] — the existing path kept."
    acceptable_paths:
      - "backlog_area_get('brief-tool') -> backlog_area_update(field='anchors', value='[\"brief/**\", \"docs/gdd/**\"]')"
    failure_modes:
      - "backlog_area_update with only docs/gdd/** — the update replaces the list and brief/** is lost"
    checks:
      - desc: "both paths present"
        sql: "SELECT count(*) FROM entities e, json_each(json_extract(e.doc,'$.anchors')) a WHERE e.kind='area' AND e.id='brief-tool' AND a.value IN ('brief/**','docs/gdd/**')"
        expect: 2
      - desc: "nothing else added"
        sql: "SELECT json_array_length(json_extract(doc,'$.anchors')) FROM entities WHERE kind='area' AND id='brief-tool'"
        expect: 2

  - id: s38-health-check
    answer: >-
      Healthy. Integrity: no dangling or circular dependencies, no status inconsistencies (validate:
      all clear). Store: nothing dirty, quarantined, stuck or flagged as conflicting; no warning.
      Derived index tables are current.
    answer_note: >-
      backlog_store_status lists one "live" session per CLI invocation of the run (each call is its
      own server process) — a harness artifact, not a finding about the backlog.
    acceptable_paths:
      - "backlog_validate + backlog_store_status (backlog_index_status optional)"
    failure_modes:
      - "store_status only (says nothing about data integrity) or validate only (nothing about the store)"
      - "backlog_index_status(rebuild=True) or backlog_sync — repairs instead of checking"
    checks:
      - log_not_called: backlog_resolve_conflict
      - log_not_called: backlog_sync
    reference:
      validate: "{c:rb_validate}"

  - id: s39-waiting-on-me
    answer: >-
      {t:secrets} is in review waiting on a human-only action: add PROVIDER_SECONDARY_KEY to the CI
      secrets (only the account owner can). Two decisions are open and need the user:
      {d:notify} (who is told when a job fails over) and {d:linking} (where the section-to-task link
      lives).
    expected_ids: ["{t:secrets}", "{d:notify}", "{d:linking}"]
    acceptable_paths:
      - "backlog_status (In Review section) + backlog_get_task + backlog_decision(action='list')"
      - "backlog_list_tasks(status='in-review') + backlog_decision(action='list')"
      - "backlog_continuity_items (action classes 'review' and 'decide')"
    failure_modes:
      - "reports only the task or only the decisions"
      - "lists every in-progress task as 'waiting on you'"
    reference:
      in_review: "{c:rb_in_review}"
      decisions: "{c:rb_decisions_open}"

  - id: s40-bugs-by-path
    answer: >-
      {b:negative_prompt}, {b:seed_dropped} and {b:style_dropped} (pipeline/providers/request.py,
      and mapping.py for the seed bug). No other bug points there.
    expected_ids: ["{b:negative_prompt}", "{b:seed_dropped}", "{b:style_dropped}"]
    acceptable_paths:
      - "backlog_query on entity_paths WHERE path LIKE 'pipeline/providers%' AND kind='bug'"
      - "backlog_bug_list -> backlog_bug_get(verbose) per bug, reading location"
    failure_modes:
      - "answers by component tag only without checking locations"
      - "includes tasks or handovers that mention the path"
    reference: "{c:rb_paths_providers}"

  - id: s41-add-dependency
    answer: "{t:batchgen} depends on both {t:retry} (kept) and {t:fallback} (added)."
    acceptable_paths:
      - "backlog_get_task('{t:batchgen}') -> backlog_update_task(field='depends_on', value='{t:retry},{t:fallback}')"
    failure_modes:
      - "backlog_update_task(field='depends_on', value='{t:fallback}') — replaces the list and drops {t:retry}"
      - "backlog_link(action='create', type='depends_on') — refuses task ids like {t:batchgen} ('invalid source ID')"
    checks:
      - desc: "both dependencies present"
        sql: "SELECT count(*) FROM entities e, json_each(json_extract(e.doc,'$.depends_on')) d WHERE e.kind='task' AND e.id='{t:batchgen}' AND d.value IN ('{t:retry}','{t:fallback}')"
        expect: 2
      - desc: "no other dependency"
        sql: "SELECT json_array_length(json_extract(doc,'$.depends_on')) FROM entities WHERE kind='task' AND id='{t:batchgen}'"
        expect: 2

  - id: s42-preview-archive
    answer: >-
      Both done CI tasks ({t:flakes}, {t:uvcache}) would go from done to archived with reason done;
      nothing is written. The agent must not archive them.
    acceptable_paths:
      - "backlog_batch_preview(operations='archive {t:flakes}\\narchive {t:uvcache}')"
    failure_modes:
      - "backlog_archive_task / backlog_batch_update — actually archives"
      - "backlog_archive_epic"
    checks:
      - desc: "nothing archived"
        sql: "SELECT count(*) FROM entities WHERE archived=1 AND ((kind='task' AND epic='ci-health') OR (kind='epic' AND id='ci-health'))"
        expect: 0
      - log_not_called: backlog_archive_task
      - log_not_called: backlog_batch_update
      - log_not_called: backlog_archive_epic
    reference: "{c:rb_batch_preview_ci}"

  - id: s43-drop-task
    answer: "{t:messages} archived with a non-done reason (wont-fix, or deprecated)."
    acceptable_paths:
      - "backlog_archive_task('{t:messages}', reason='wont-fix')"
    failure_modes:
      - "default reason 'done' — refused for a todo task; agent gives up"
      - "sets status done (refused) and reports success anyway"
      - "archives the whole asset-pipeline epic"
    checks:
      - desc: "task archived"
        sql: "SELECT archived FROM entities WHERE kind='task' AND id='{t:messages}'"
        expect: 1
      - desc: "nothing else archived"
        sql: "SELECT count(*) FROM entities WHERE kind IN ('task','epic') AND archived=1"
        expect: 1

  - id: s44-record-merge
    answer: "{t:uvcache} carries merge rung master at 9f3c2ab."
    acceptable_paths:
      - "backlog_record_merge(task_id='{t:uvcache}', rung='master', sha='9f3c2ab')"
    failure_modes:
      - "backlog_record_gate or backlog_update_task(branch=...) — wrong field"
      - "records it on {t:flakes}"
    checks:
      - desc: "merge recorded"
        sql: "SELECT json_extract(doc,'$.merge_status.master.merge_commit') FROM entities WHERE kind='task' AND id='{t:uvcache}'"
        expect: "9f3c2ab"

  - id: s45-park-workstream
    answer: "Thread atlas-budget set to parked (reason: until beta)."
    acceptable_paths:
      - "backlog_thread_list -> backlog_thread_update(name='atlas-budget', status='parked', reason=...)"
    failure_modes:
      - "backlog_handover_update_status(status='closed') on its handover"
      - "backlog_update_task(field='status', value='blocked') on {t:atlas}"
    checks:
      - log_called: backlog_thread_update
        args: {name: "atlas-budget", status: "parked"}
        desc: "thread parked"
      - log_not_called: backlog_handover_update_status

  - id: s46-relate-idea-issue
    answer: >-
      {idea:warm_up} and {i:timeouts} recorded as related (either direction). Verified at seed time:
      backlog_link(action='create', ...) answers "ok: linked {idea:warm_up} -[relates_to]-> {i:timeouts}"
      but persists nothing (no link row, no change-log row, a later query returns []), so an agent
      that trusts that answer reports a link that does not exist. Only
      backlog_idea_update(related_issues) actually stores the relation today. Grade the tool choice
      (backlog_link is the natural one) separately from the stored result.
    acceptable_paths:
      - "backlog_link(action='create', source='{idea:warm_up}', target='{i:timeouts}', type='relates_to') — the intended tool; currently a silent no-op"
      - "backlog_idea_update('{idea:warm_up}', field='related_issues', value='{i:timeouts}')"
    failure_modes:
      - "reports the link as made without reading it back (the usual outcome with backlog_link today)"
      - "links the archived token-cache idea {idea:token_cache} or the P3 issue"
      - "creates a new idea or issue"
    checks:
      - desc: "the relation is stored (link row or the idea's related_issues)"
        sql: "SELECT (SELECT count(*) FROM links WHERE (src_id='{idea:warm_up}' AND dst_id='{i:timeouts}') OR (src_id='{i:timeouts}' AND dst_id='{idea:warm_up}')) + (SELECT count(*) FROM entities e, json_each(json_extract(e.doc,'$.related_issues')) r WHERE e.kind='idea' AND e.id='{idea:warm_up}' AND r.value='{i:timeouts}')"
        expect_min: 1
      - log_called: backlog_link
        desc: "used the link tool (informational: it does not persist today)"

  - id: s47-stale-claim
    answer: >-
      The claim on {t:retag03} is held by a session whose process is gone (live false, expired
      true), so it can be released; after release the task has no holder. The agent should not take
      the task itself.
    acceptable_paths:
      - "backlog_claim(action='status', task_id='{t:retag03}') -> backlog_claim(action='release', task_id='{t:retag03}')"
    failure_modes:
      - "backlog_pick_task(force=True) — steals the task for the agent's own session"
      - "backlog_update_task(field='status', value='todo') — status changed, claim untouched"
    checks:
      - desc: "no holder left"
        sql: "SELECT coalesce(json_extract(doc,'$.locked_by'),'') FROM entities WHERE kind='task' AND id='{t:retag03}'"
        expect: ""
      - log_not_called: backlog_pick_task
