# User intent: run the Linux lane's serve, regression and deploy tiers on GitHub's ubuntu-24.04 for changes to the
# server path, with no secrets and read-only access; the local WSL lane stays the source of truth (team-server-016 Q2).
name: linux-serve
on:
  push:
    paths:
      - "taskmaster/**"
      - "deploy/**"
      - "tests/**"
      - "scripts/linux_lane.sh"
      - "scripts/linux_rehearsal.sh"
      - "docs/runbooks/team-server-deploy.md"
      - ".github/workflows/linux-serve.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "taskmaster/**"
      - "deploy/**"
      - "tests/**"
      - "scripts/linux_lane.sh"
      - "scripts/linux_rehearsal.sh"
      - "docs/runbooks/team-server-deploy.md"
      - ".github/workflows/linux-serve.yml"
      - "pyproject.toml"
      - "uv.lock"
permissions:
  contents: read
jobs:
  lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv (pinned release, checked against its published checksum)
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.11.2/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "7ac2ca0449c8d68dae9b99e635cd3bc9b22a4cb1de64b7c43716398447d42981  /tmp/uv.tar.gz" | sha256sum -c -
          tar -xzf /tmp/uv.tar.gz -C /tmp
          sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
      - name: Linux lane
        run: bash scripts/linux_lane.sh --tier serve --tier regression --tier deploy --dir "$RUNNER_TEMP/lane"
